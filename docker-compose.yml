# Campus Native Agent 容器编排（MySQL + 后端 + 前端）
#
# 起法：docker compose up --build
#   访问：前端 http://localhost:8080（nginx 托管 + /api 反代后端）
# 本机开发仍用 .env 的 DATABASE_URL 连本机 MySQL80，不用本文件（M3 约定）。
#
# ⚠️ 刻意不用 env_file: .env——文件缺失会让 compose 直接报错，破坏"一键起"；
#    改用显式 environment + ${VAR:-} 插值（DEEPSEEK_API_KEY 不传也能起，对话降级规则兜底）

services:
  mysql:
    image: mysql:8.0
    container_name: campus_desk_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: campus_desk
      TZ: Asia/Shanghai
    # 不发布端口：容器内网互访即可；本机要连容器 MySQL 用
    # docker-compose.override.yml（3307 避开本机 MySQL80 服务）
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    container_name: campus_desk_backend
    environment:
      DATABASE_URL: mysql+pymysql://root:root@mysql:3306/campus_desk?charset=utf8mb4
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash-vision-exp}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-0123456789abcdef}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
      # M15B-② 演示账号密码（默认 123456，部署可覆盖；幂等坑见 .env.example）
      SEED_PASSWORD: ${SEED_PASSWORD:-123456}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      # 容器内访问宿主机 Langfuse 用 host.docker.internal（localhost 指向容器自身会 Connection refused）
      LANGFUSE_HOST: http://host.docker.internal:3001
    depends_on:
      mysql:
        condition: service_healthy
    # M15B-④ 不发布 8000：前端只经 nginx(8080) 反代访问后端，
    # 防止绕过 nginx 安全层直连后端（本机开发仍走 uvicorn 8000，不受影响）
    # ports:
    #   - "8000:8000"

  frontend:
    build: ./frontend
    container_name: campus_desk_frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mysql_data:
