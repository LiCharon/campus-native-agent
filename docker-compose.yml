# CampusDesk 容器编排（M6 一键起：MySQL + 后端 + 前端）
#
# 起法：docker compose up --build
#   访问：前端 http://localhost:8080（nginx 托管 + /api 反代后端）
# 本机开发仍用 .env 的 DATABASE_URL 连本机 MySQL80，不用本文件（M3 约定）。
#
# ⚠️ 刻意不用 env_file: .env——文件缺失会让 compose 直接报错，破坏"一键起"；
#    改用显式 environment + ${VAR:-} 插值（DEEPSEEK_API_KEY 不传也能起，对话降级规则兜底）

services:
  mysql:
    image: mysql:8.0
    container_name: campus_desk_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: campus_desk
      TZ: Asia/Shanghai
    # 不发布端口：容器内网互访即可；本机要连容器 MySQL 用
    # docker-compose.override.yml（3307 避开本机 MySQL80 服务）
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: campus_desk_redis
    # 不发布端口：同上，本机连容器 Redis 用 override 的 6380
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    container_name: campus_desk_backend
    environment:
      DATABASE_URL: mysql+pymysql://root:root@mysql:3306/campus_desk?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-0123456789abcdef}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      # 容器内访问宿主机 Langfuse 用 host.docker.internal（localhost 指向容器自身会 Connection refused）
      LANGFUSE_HOST: http://host.docker.internal:3001
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        # 只保启动顺序不设 healthy 条件——Redis 是缓存非必需依赖，
        # 连不上时 backend 自动降级直查 DB（faq_cache 30s 冷却后重探自愈）
        condition: service_started
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: campus_desk_frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mysql_data:
