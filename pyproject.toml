[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-desk"
version = "0.1.0"
description = "Campus Native Agent — 校园智能服务助手"
requires-python = ">=3.14"
dependencies = [
    "langgraph>=1.2.10",
    "langchain>=1.3.14",
    "langchain-openai>=1.4.1",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "fastapi>=0.141.1",
    "uvicorn>=0.30",  # ASGI 服务器（M6 API 层）
    "pyjwt>=2.12.1",  # JWT 签发/校验（M6 登录鉴权；2.11 起支持 Python 3.14）
    "sqlalchemy>=2.0.51",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "httpx>=0.28.1",
    "langfuse>=3",
    "python-dotenv>=1.2.2",
    "pymysql>=1.2.0",
    "alembic>=1.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint.flake8-bugbear]
# FastAPI 惯用写法：Depends/Query 在参数默认值中调用（B008 官方豁免配置）；
# require_roles / require_perm 是"工厂返回依赖"的标准模式（deps.py）
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "campus_desk.api.deps.require_roles",
    "campus_desk.api.deps.require_perm",
]
