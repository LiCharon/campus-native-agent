[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-desk"
version = "0.1.0"
description = "CampusDesk（校园服务台）— 校园智能服务台 Agent"
requires-python = ">=3.14"
dependencies = [
    "langgraph>=1.2.10",
    "langchain>=1.3.14",
    "langchain-openai>=1.4.1",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "fastapi>=0.141.1",
    "sqlalchemy>=2.0.51",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "sse-starlette>=3.4.6",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
    "pymysql>=1.2.0",
    "alembic>=1.19.0",
    "apscheduler>=3.11,<4",  # 后台调度（M5 超时扫描；<4：v4 异步重构，BackgroundScheduler 不存在）
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 100
