# Campus Native Agent 前端 nginx（M6）：SPA 路由 + /api 反代后端容器
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由：找不到文件回退 index.html（vue-router history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代到后端容器（compose 服务名 backend，保留 /api 前缀）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
}
